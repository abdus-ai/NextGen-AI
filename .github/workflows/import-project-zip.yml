name: Import NextGen project archive

on:
  push:
    branches: [main]
    paths:
      - ".trigger-import"

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project into repository root
        shell: bash
        run: |
          set -euo pipefail
          test -f NextGen-main.zip
          mkdir -p /tmp/nextgen-import
          unzip -q NextGen-main.zip -d /tmp/nextgen-import
          test -d /tmp/nextgen-import/NextGen-main
          rsync -a --exclude='.github/' /tmp/nextgen-import/NextGen-main/ ./
          rm -rf NextGen-main.zip /tmp/nextgen-import
          rm -f .trigger-import

      - name: Commit imported project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project changes to commit."
            exit 0
          fi
          git commit -m "Import NextGen project source"
          git push
